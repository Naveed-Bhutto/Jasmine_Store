<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Jasmine Store</title>
<style>
  :root{--bg:#f7f2e6;--card:#fffdf7;--border:rgba(107,124,88,.22);--text:#3d4a34;--muted:#6f7a63;--sage:#6f8a5e;--sage2:#55704a;--gold:#c9a86a;--danger:#c25e5e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:1rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:2.4rem;max-width:380px;width:100%;box-shadow:0 12px 34px rgba(80,90,60,.14);text-align:center}
  .mark{font-size:2.4rem}
  h1{font-size:1.35rem;color:var(--sage2);margin:.4rem 0 .2rem}
  h1 span{color:var(--gold)}
  p{color:var(--muted);font-size:.88rem;margin-bottom:1.4rem}
  input{width:100%;padding:.75rem 1rem;border:1px solid var(--border);border-radius:10px;font:inherit;outline:none;text-align:center}
  input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(111,138,94,.15)}
  button{width:100%;margin-top:.9rem;padding:.75rem;border:none;border-radius:999px;background:var(--sage);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s}
  button:hover{background:var(--sage2)}
  .err{color:var(--danger);font-size:.85rem;font-weight:600;margin-top:.8rem;min-height:1.2em}
  a{display:inline-block;margin-top:1.2rem;color:var(--muted);font-size:.82rem;text-decoration:none}
  a:hover{color:var(--sage2)}
</style>
</head>
<body>
  <form class="card" method="POST" action="/admin/login">
    <div class="mark">🌸</div>
    <h1>Jasmine <span>Store</span></h1>
    <p>Admin Panel — enter your password</p>
    <input type="password" name="password" placeholder="••••••••" autofocus required autocomplete="current-password" />
    <button type="submit">Unlock Admin Panel</button>
    <p class="err" id="err"></p>
    <a href="/">← Back to website</a>
  </form>
  <script>
    if (new URLSearchParams(location.search).get("error"))
      document.getElementById("err").textContent = "❌ Wrong password. Try again.";
  </script>
</body>
</html>
